name: CI

# Manual only: the same checks run locally before every push (see
# scripts/check.sh and .githooks/pre-push). Use "Run workflow" in the
# Actions tab when you want a clean-machine run.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Build + browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pinboard
          POSTGRES_PASSWORD: pinboard
          POSTGRES_DB: pinboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinboard -d pinboard_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values for throwaway services; nothing here is used in production.
      DATABASE_URL: postgresql://pinboard:pinboard@localhost:5432/pinboard_e2e?schema=public
      E2E_DATABASE_URL: postgresql://pinboard:pinboard@localhost:5432/pinboard_e2e?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
