<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8851f5" />
    <title>Pinboard · Offline / غير متصل</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f8f8f6;
        color: #1c1917;
        font:
          17px/1.7 system-ui,
          sans-serif;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e7e5e0;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      img {
        border-radius: 20px;
      }
      h1,
      h2 {
        font-size: 23px;
        line-height: 1.4;
        margin: 18px 0 8px;
      }
      p {
        color: #57534e;
        margin: 8px 0 20px;
      }
      section + section {
        border-top: 1px solid #e7e5e0;
        padding-top: 4px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        background: #8851f5;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #6a35d6;
        outline-offset: 3px;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" width="72" height="72" alt="Tanweel" />
      <section>
        <h1>You’re offline</h1>
        <p>Reconnect to view your requests and tasks. Changes cannot be saved while offline.</p>
      </section>
      <section lang="ar" dir="rtl">
        <h2>أنت غير متصل بالإنترنت</h2>
        <p>أعد الاتصال لعرض طلباتك ومهامك. لا يمكن حفظ التغييرات دون اتصال.</p>
      </section>
      <button type="button" onclick="location.reload()">
        Try again · <span lang="ar" dir="rtl">إعادة المحاولة</span>
      </button>
      <small>Pinboard · Tanweel</small>
    </main>
  </body>
</html>
